<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2430">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>حساب‌داری فروشگاه صانع</title>

<!-- فونت وزیرمتن: قبلاً فقط در CSS نوشته شده بود ولی هیچ‌جا لود نمی‌شد و به Tahoma می‌افتاد -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2">
<link rel="stylesheet" href="./styles.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <b id="biz-name">فروشگاه صانع</b>
    <div class="brand-meta">
      <span class="sync-badge offline" id="sync-badge"><span class="sync-dot"></span><span id="sync-text">درحال اتصال...</span></span>
      <span id="biz-date"></span>
    </div>
  </div>
  <div class="actions">
    <button type="button" onclick="App.openSearch()" title="جستجو" aria-label="جستجو">
      <svg class="icn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="M20 20l-4.4-4.4"></path></svg>
    </button>
    <button type="button" onclick="App.navigate('more','settings')" title="تنظیمات" aria-label="تنظیمات">
      <svg class="icn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"></circle><path d="M19.4 14.6a1.6 1.6 0 0 0 .33 1.77l.06.06a1.9 1.9 0 1 1-2.7 2.7l-.06-.06a1.6 1.6 0 0 0-2.72 1.14v.17a1.9 1.9 0 1 1-3.8 0v-.09a1.6 1.6 0 0 0-2.8-1.13l-.06.06a1.9 1.9 0 1 1-2.7-2.7l.06-.06a1.6 1.6 0 0 0-1.14-2.72h-.17a1.9 1.9 0 1 1 0-3.8h.09A1.6 1.6 0 0 0 4.9 6.9l-.06-.06a1.9 1.9 0 1 1 2.7-2.7l.06.06a1.6 1.6 0 0 0 2.72-1.14V3a1.9 1.9 0 1 1 3.8 0v.09a1.6 1.6 0 0 0 2.72 1.14l.06-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.06a1.6 1.6 0 0 0 1.14 2.72H21a1.9 1.9 0 1 1 0 3.8h-.09a1.6 1.6 0 0 0-1.51.95"></path></svg>
    </button>
  </div>
</header>

<main id="screen"></main>
<nav class="bottomnav" id="bottomnav"></nav>

<div id="modal-root"></div>
<div id="actionmenu-root"></div>
<div id="search-root"></div>
<div id="pin-root"></div>
<div id="toast-root"></div>

<script type="module" src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW register failed', err));
    });
  }
</script>
</body>
</html>
