<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2430">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>حساب‌داری فروشگاه صانع</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --ink:#181F2A;
    --ink2:#232D3D;
    --paper:#F6F5F1;
    --card:#FFFFFF;
    --gold:#C9922B;
    --gold-d:#9c7419;
    --gold-bg:#FBF3E2;
    --green:#227A57;
    --green-bg:#E4F5EC;
    --red:#C13B2C;
    --red-bg:#FCEAE7;
    --muted:#707A87;
    --border:#E7E4DB;
    --radius:16px;
    --radius-sm:11px;
    --shadow-sm:0 1px 3px rgba(24,31,42,.06);
    --shadow-md:0 6px 20px rgba(24,31,42,.10);
    --shadow-lg:0 14px 44px rgba(24,31,42,.22);
    --ease:cubic-bezier(.22,.9,.35,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Vazirmatn','Noto Sans Arabic',Tahoma,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:82px;
  }
  ::selection{background:var(--gold-bg);color:var(--gold-d);}
  .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-family:'Vazirmatn',Tahoma,sans-serif;}

  /* ---------- Top bar ---------- */
  header.topbar{
    background:linear-gradient(180deg,var(--ink) 0%, var(--ink2) 100%);
    color:#fff;
    padding:13px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;top:0;z-index:20;
    box-shadow:var(--shadow-md);
  }
  header.topbar .brand{display:flex;flex-direction:column;gap:2px;}
  header.topbar .brand b{font-size:16px;letter-spacing:.2px;}
  header.topbar .brand span{font-size:11px;color:#a9a394;}
  header.topbar .actions{display:flex;align-items:center;gap:4px;}
  header.topbar button{
    background:rgba(255,255,255,.08);border:none;color:#fff;font-size:17px;cursor:pointer;
    padding:8px;border-radius:10px;line-height:1;transition:background .15s var(--ease);
  }
  header.topbar button:active{background:rgba(255,255,255,.2);}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px;}
  .sync-badge{display:flex;align-items:center;font-size:10.5px;color:#c9c4b6;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.06);}
  .sync-badge.ok .sync-dot{background:#59d69a;}
  .sync-badge.pending .sync-dot{background:#e8b64b;animation:pulse 1.1s infinite;}
  .sync-badge.offline .sync-dot{background:#e35b4a;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  main#screen{padding:14px;max-width:640px;margin:0 auto;animation:fadeIn .22s var(--ease);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px;
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
  }
  .hero{
    background:linear-gradient(135deg,var(--ink) 0%, var(--ink2) 100%);
    color:#fff;
    border-radius:18px;
    padding:17px 16px;
    margin-bottom:14px;
    box-shadow:var(--shadow-md);
  }
  .hero .row{display:flex;justify-content:space-between;align-items:flex-end;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.13);}
  .hero .row:last-child{border-bottom:none;}
  .hero .row .label{font-size:12.5px;color:#b7b1a2;}
  .hero .row .val{font-size:19px;font-weight:700;color:var(--gold);}
  .hero .row .val.green{color:#6fd9ac;}
  .hero .row .val.red{color:#f28b7f;}
  .ledger-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .ledger-strip .chip{
    flex:0 0 auto;background:#fff;border:1px solid var(--border);border-radius:13px;
    padding:10px 14px;min-width:108px;text-align:center;box-shadow:var(--shadow-sm);
  }
  .ledger-strip .chip .t{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .ledger-strip .chip .v{font-size:15px;font-weight:700;border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px;}
  .ledger-strip .chip.warn{border-color:var(--red);background:var(--red-bg);}
  .ledger-strip .chip.warn .v{border-bottom-color:var(--red);color:var(--red);}
  h2.section-title{font-size:14.5px;margin:20px 0 9px;color:var(--ink);border-inline-start:4px solid var(--gold);padding-inline-start:9px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
  .qa-btn{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 4px;
    text-align:center;font-size:12.5px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow-sm);
    transition:transform .12s var(--ease),box-shadow .12s var(--ease);
  }
  .qa-btn:active{transform:scale(.96);box-shadow:none;}
  .qa-btn .ic{font-size:22px;display:block;margin-bottom:5px;}
  .row-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .row-item:last-child{border-bottom:none;}
  .row-item.clickable{cursor:pointer;transition:background .12s;border-radius:8px;margin:0 -6px;padding:10px 6px;}
  .row-item.clickable:active{background:var(--paper);}
  .row-item .r-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .row-item .r-left .sub{font-size:11.5px;color:var(--muted);}
  .row-item .r-right{font-weight:700;white-space:nowrap;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.gold{background:var(--gold-bg);color:var(--gold-d);}
  label{display:block;font-size:12.5px;color:var(--muted);margin:11px 0 5px;font-weight:600;}
  input,select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
    font-size:14.5px;background:#fff;color:var(--ink);font-family:inherit;transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  textarea{resize:vertical;min-height:50px;}
  .btn{
    display:inline-block;width:100%;padding:13px;border-radius:13px;border:none;
    font-size:15px;font-weight:700;cursor:pointer;text-align:center;margin-top:12px;
    transition:transform .1s var(--ease),filter .12s var(--ease);
  }
  .btn:active{transform:scale(.98);filter:brightness(.95);}
  .btn-primary{background:var(--gold);color:#fff;box-shadow:0 4px 14px rgba(201,146,43,.3);}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-sm{width:auto;padding:8px 15px;font-size:13px;margin-top:0;}
  .item-row{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-radius:11px;padding:9px 11px;margin-bottom:6px;font-size:13px;}
  .item-row .x{color:var(--red);cursor:pointer;font-weight:900;padding:2px 7px;}
  .total-line{display:flex;justify-content:space-between;font-size:16.5px;font-weight:800;padding:11px 0;border-top:2px solid var(--ink);margin-top:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tabbar-sub{display:flex;gap:6px;margin-bottom:12px;}
  .tabbar-sub button{
    flex:1;padding:9px;border-radius:11px;border:1.5px solid var(--border);background:#fff;
    font-size:13px;cursor:pointer;color:var(--ink);transition:all .15s;
  }
  .tabbar-sub button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  nav.bottomnav{
    position:fixed;bottom:0;right:0;left:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;z-index:30;box-shadow:0 -4px 18px rgba(24,31,42,.07);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;padding:9px 2px 8px;text-align:center;cursor:pointer;color:var(--muted);
    position:relative;transition:color .15s;
  }
  nav.bottomnav button.active{color:var(--gold-d);}
  nav.bottomnav button.active .ic{transform:translateY(-1px);}
  nav.bottomnav .ic{display:block;font-size:20px;transition:transform .15s var(--ease);}
  nav.bottomnav .lb{display:block;font-size:10.5px;margin-top:2px;}
  nav.bottomnav .nav-dot{position:absolute;top:4px;left:calc(50% + 9px);background:var(--red);color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 8px;}
  .empty .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.5;}
  .more-list button{
    width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);
    border-radius:13px;padding:14px;margin-bottom:9px;font-size:14.5px;cursor:pointer;color:var(--ink);
    text-align:right;box-shadow:var(--shadow-sm);transition:transform .1s var(--ease);
  }
  .more-list button:active{transform:scale(.985);}
  .more-list .ic{font-size:19px;width:26px;text-align:center;}
  .more-list .chev{margin-inline-start:auto;color:var(--muted);opacity:.6;}
  .back-btn{background:none;border:none;color:var(--gold-d);font-size:14px;cursor:pointer;padding:6px 0 10px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .field-note{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6;}
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .period-btns{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .period-btns button{padding:8px 13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;transition:all .15s;}
  .period-btns button.active{background:var(--gold);color:#fff;border-color:var(--gold);}

  /* ---------- Modal / bottom-sheet (replaces prompt/confirm) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,31,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s var(--ease);}
  .modal-overlay.center{align-items:center;padding:16px;}
  .modal-sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .22s var(--ease);box-shadow:var(--shadow-lg);}
  .modal-overlay.center .modal-sheet{border-radius:18px;max-height:82vh;}
  @keyframes slideUp{from{transform:translateY(24px);opacity:.4;}to{transform:none;opacity:1;}}
  .modal-sheet .modal-title{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .modal-sheet .modal-title .close{cursor:pointer;color:var(--muted);font-size:20px;padding:4px 8px;}
  .modal-sheet .modal-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{margin-top:0;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 12px;}

  /* ---------- Action menu (⋮) ---------- */
  .menu-dots{cursor:pointer;font-size:19px;color:var(--muted);padding:4px 9px;border-radius:8px;line-height:1;}
  .menu-dots:active{background:var(--paper);}
  .action-menu{position:fixed;inset:0;z-index:210;background:rgba(20,24,31,.4);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s var(--ease);}
  .action-menu .sheet{background:#fff;width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));animation:slideUp .2s var(--ease);}
  .action-menu .opt{display:flex;align-items:center;gap:12px;padding:14px 12px;font-size:14.5px;cursor:pointer;border-radius:12px;color:var(--ink);}
  .action-menu .opt:active{background:var(--paper);}
  .action-menu .opt.danger{color:var(--red);}
  .action-menu .opt .ic{font-size:18px;width:24px;text-align:center;}
  .action-menu .cancel{margin-top:6px;text-align:center;padding:14px;color:var(--muted);font-weight:700;cursor:pointer;border-top:1px solid var(--border);}

  /* ---------- Search ---------- */
  .search-overlay{position:fixed;inset:0;z-index:220;background:var(--paper);display:flex;flex-direction:column;animation:fadeIn .15s;}
  .search-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border);}
  .search-bar input{flex:1;border:none;background:var(--paper);padding:11px 14px;border-radius:12px;font-size:15px;}
  .search-bar .cancel{color:var(--gold-d);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  .search-results{flex:1;overflow-y:auto;padding:8px 14px;}
  .search-group-title{font-size:11.5px;color:var(--muted);font-weight:700;margin:14px 4px 6px;}

  /* ---------- PIN lock ---------- */
  .pin-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--ink),var(--ink2));z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;}
  .pin-dots{display:flex;gap:14px;margin:26px 0;}
  .pin-dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);}
  .pin-dots span.filled{background:var(--gold);border-color:var(--gold);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  .pin-pad button{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:21px;cursor:pointer;}
  .pin-pad button:active{background:rgba(255,255,255,.18);}
  .pin-pad button.ghost{background:none;border:none;}

  /* ---------- Low stock ---------- */
  .stock-badge{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px;margin-inline-start:6px;}

  /* ---------- Invoice / Print ---------- */
  .inv-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .inv-actions .btn{margin-top:0;flex:1;min-width:120px;}
  .inv-actions .btn-wa{background:#25D366;color:#fff;}
  .inv-head{text-align:center;padding:10px 0 16px;border-bottom:2px dashed var(--border);margin-bottom:14px;}
  .inv-head .logo{font-size:38px;line-height:1;margin-bottom:4px;}
  .inv-head .biz{font-size:19px;font-weight:800;color:var(--ink);}
  .inv-head .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .inv-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;background:var(--paper);border-radius:11px;padding:10px 12px;}
  .inv-meta b{color:var(--gold-d);}
  .inv-cust{font-size:13.5px;background:var(--paper);border-radius:11px;padding:10px 12px;margin-bottom:14px;}
  .inv-cust .l1{font-weight:700;margin-bottom:2px;}
  table.inv-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;}
  table.inv-table th{background:var(--ink);color:#fff;padding:8px 5px;font-size:11.5px;}
  table.inv-table th:first-child{border-radius:8px 0 0 0;}
  table.inv-table th:last-child{border-radius:0 8px 0 0;}
  table.inv-table td{padding:8px 5px;border-bottom:1px solid var(--border);text-align:center;}
  table.inv-table td:nth-child(2){text-align:right;}
  .inv-totals{margin-top:8px;}
  .inv-totals .row-item{font-size:13.5px;}
  .inv-footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);}
  .inv-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:12px;color:var(--muted);}
  .inv-sign .line{border-top:1px solid var(--muted);width:110px;padding-top:4px;text-align:center;}
  .bill-thumb{max-width:120px;max-height:120px;border-radius:9px;border:1px solid var(--border);cursor:pointer;display:block;}
  .img-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;}
  .img-viewer-overlay img{max-width:92vw;max-height:76vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .img-viewer-close{background:#fff;border:none;border-radius:20px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;}
  @media print{
    body *{visibility:hidden;}
    header.topbar, nav.bottomnav{display:none !important;}
    #invoice-print, #invoice-print *{visibility:visible;}
    #invoice-print{position:absolute;top:0;right:0;left:0;width:100%;padding:12px;}
    .no-print, .img-viewer-overlay{display:none !important;}
    body{padding-bottom:0;background:#fff;}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <b id="biz-name">فروشگاه صانع</b>
    <span class="sync-badge offline" id="sync-badge"><span class="sync-dot"></span><span id="sync-text">درحال اتصال...</span></span>
  </div>
  <div class="actions">
    <button onclick="App.openSearch()" title="جستجو">🔍</button>
    <button onclick="App.navigate('more','settings')" title="تنظیمات">⚙️</button>
  </div>
</header>
<main id="screen"></main>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="actionmenu-root"></div>
<div id="search-root"></div>
<div id="pin-root"></div>
<div id="toast-root"></div>

<script type="module">
/* ---------- Firebase ---------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot,
  collection, writeBatch, increment
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1ro1e1rwR7dB9gHGWQkwq2G2r1ZolLGs",
  authDomain: "motar-pakhsh.firebaseapp.com",
  projectId: "motar-pakhsh",
  storageBucket: "motar-pakhsh.firebasestorage.app",
  messagingSenderId: "220111355867",
  appId: "1:220111355867:web:22fe8b83980f82f2cb71fe"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
setPersistence(auth, browserLocalPersistence).catch(()=>{});

const BIZ_ID = 'main';
/* هر نوع رکورد حالا کالکشن جدای خودش را دارد — دیگر یک سند مشترک بزرگ نیست.
   یعنی ویرایش یک فاکتور، رکورد فاکتور دیگری را از دست نمی‌برد. */
const COLLECTIONS = ['products','customers','suppliers','sales','purchases','expenses','payments','openingEntries'];
const cols = {};
COLLECTIONS.forEach(name => { cols[name] = collection(db, 'businesses', BIZ_ID, name); });
const settingsDocRef   = doc(db, 'businesses', BIZ_ID, 'meta', 'settings');
const migratedFlagRef  = doc(db, 'businesses', BIZ_ID, 'meta', 'migratedV2');
const oldStateDocRef   = doc(db, 'businesses', BIZ_ID, 'data', 'state'); // ساختار قدیمی (فقط برای مهاجرت یک‌باره)
const teamDocRef       = (uid_) => doc(db, 'businesses', BIZ_ID, 'team', uid_);

/* ---------- Helpers ---------- */
function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- شناسهٔ دستگاه (گوشی) ----------
   هر گوشی/مرورگر یک شناسهٔ ثابت محلی می‌گیرد که در تمام رکوردهای ثبت‌شده از همان گوشی ذخیره می‌شود.

function getDeviceId(){
  let id;

function fmt(n){ n = Math.round(Number(n)||0); return n.toLocaleString('en-US'); }
// برای مبالغ دالری/سنتی و نرخ دالر — هیچ‌وقت گرد نمی‌شود، همیشه با اعشار (سنت) نشان داده می‌شود.
function fmt2(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  const fixed = n.toFixed(2);
  const [intPart, decPart] = fixed.split('.');
  return (neg?'-':'') + Number(intPart).toLocaleString('en-US') + '.' + decPart;
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sum(arr,key){ return arr.reduce((a,b)=>a+(Number(b[key])||0),0); }
/* ---------- فشرده‌سازی عکس (بل شرکت / رسید پرداخت) ----------
   عکس‌ها به‌صورت JPEG فشرده و base64 مستقیم داخل سند Firestore ذخیره می‌شوند
   (نه Firebase Storage) تا کاملاً با ذخیره‌سازی آفلاین فایراستور سازگار بمانند
   و بدون اتصال اینترنت هم ثبت و بعداً خودکار سینک شوند. سقف سند فایراستور ۱ مگابایت
   است، پس عکس تا حد امن (~700 کیلوبایت base64) فشرده می‌شود. */
function _loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('خواندن فایل عکس ناکام شد'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('این فایل یک عکس معتبر نیست'));
      img.onload = ()=>resolve(img);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function _resizeImageToDataUrl(img, maxDim, quality){
  let w=img.width, h=img.height;
  if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
  else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
  const canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(img,0,0,w,h);
  return canvas.toDataURL('image/jpeg', quality);
}
async function compressImageForStorage(file){
  if(!file || !file.type || file.type.indexOf('image/')!==0){ throw new Error('لطفاً یک فایل عکس انتخاب کنید'); }
  const img = await _loadImageFromFile(file);
  const attempts = [[1100,0.62],[850,0.5],[650,0.4],[500,0.32]];
  let lastUrl=null;
  for(const [dim,q] of attempts){
    lastUrl = _resizeImageToDataUrl(img, dim, q);
    if(lastUrl.length < 700000) return lastUrl; // ~500KB باینری، امن زیر سقف ۱ مگابایتی سند
  }
  if(lastUrl.length < 950000) return lastUrl;
  throw new Error('حجم عکس بعد از فشرده‌سازی هنوز زیاد است؛ لطفاً با نور بهتر یا نزدیک‌تر دوباره عکس بگیرید.');
}
function dateLabel(d){
  const dt=new Date(d+'T00:00:00');
  const days=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  return days[dt.getDay()]+' '+d;
}
function startOfWeek(d){
  const dt=new Date(d+'T00:00:00');
  const day=dt.getDay();
  dt.setDate(dt.getDate()-day);
  return dt.toISOString().slice(0,10);
}
function startOfMonth(d){ return d.slice(0,7)+'-01'; }
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function defaultSettings(){
  return { businessName:'فروشگاه صانع', currency:'افغانی', openingCash:0,
    invoiceCounter:0, businessPhone:'', businessAddress:'', logoEmoji:'🏪', openingNote:'', usdRate:0, lowStockThreshold:1 };
}
function migrateSettings(s){
  s = s || {};
  if(s.invoiceCounter===undefined) s.invoiceCounter=0;
  if(s.businessName===undefined) s.businessName='فروشگاه صانع';
  if(s.currency===undefined) s.currency='افغانی';
  if(s.openingCash===undefined) s.openingCash=0;
  if(s.businessPhone===undefined) s.businessPhone='';
  if(s.businessAddress===undefined) s.businessAddress='';
  if(s.logoEmoji===undefined) s.logoEmoji='🏪';
  if(s.openingNote===undefined) s.openingNote='';
  if(s.usdRate===undefined) s.usdRate=0;
  if(s.lowStockThreshold===undefined) s.lowStockThreshold=1;
  return s;
}
function migrateRecordArrays(sales, purchases){
  (sales||[]).forEach(s=>{
    if(!s.status) s.status='active';
    if(!s.returns) s.returns=[];
    if(s.originalTotal===undefined) s.originalTotal=s.total;
    (s.items||[]).forEach(it=>{ if(it.returnedQty===undefined) it.returnedQty=0; });
  });
  (purchases||[]).forEach(p=>{
    if(!p.status) p.status='active';
    if(!p.returns) p.returns=[];
    if(p.originalTotal===undefined) p.originalTotal=p.total;
    if(!p.currency) p.currency='AFN';
    if(p.rateAtPurchase===undefined) p.rateAtPurchase=0;
    (p.items||[]).forEach(it=>{ if(it.returnedQty===undefined) it.returnedQty=0; });
  });
}

/* ---------- Migration: انتقال یک‌بارهٔ دیتای قدیمی (یک سند مشترک) به کالکشن‌های جدید ---------- */
async function migrateOldDataIfNeeded(){
  try{
    const flagSnap = await getDoc(migratedFlagRef);
    if(flagSnap.exists() && flagSnap.data().done) return; // قبلاً انجام شده

    const oldSnap = await getDoc(oldStateDocRef);
    if(!oldSnap.exists()){
      await setDoc(migratedFlagRef, {done:true, ts:Date.now(), note:'دیتای قدیمی وجود نداشت'});
      return;
    }
    const old = oldSnap.data();
    migrateSettings(old.settings);
    migrateRecordArrays(old.sales, old.purchases);

    const allRecords = [];
    (old.products||[]).forEach(r=>allRecords.push(['products',r]));
    (old.customers||[]).forEach(r=>allRecords.push(['customers',r]));
    (old.suppliers||[]).forEach(r=>allRecords.push(['suppliers',r]));
    (old.sales||[]).forEach(r=>allRecords.push(['sales',r]));
    (old.purchases||[]).forEach(r=>allRecords.push(['purchases',r]));
    (old.expenses||[]).forEach(r=>allRecords.push(['expenses',r]));
    (old.payments||[]).forEach(r=>allRecords.push(['payments',r]));
    (old.openingEntries||[]).forEach(r=>allRecords.push(['openingEntries',r]));

    // نوشتن دسته‌ای (هر batch حداکثر ۴۰۰ عملیات، برای اطمینان زیر سقف ۵۰۰ فایراستور)
    for(let i=0;i<allRecords.length;i+=400){
      const chunk = allRecords.slice(i,i+400);
      const batch = writeBatch(db);
      chunk.forEach(([colName,rec])=>{
        if(!rec.id) rec.id=uid();
        batch.set(doc(cols[colName], rec.id), rec);
      });
      await batch.commit();
    }
    await setDoc(settingsDocRef, migrateSettings(old.settings));
    await setDoc(migratedFlagRef, {done:true, ts:Date.now(), migratedCount:allRecords.length});
    console.log('مهاجرت دیتای قدیمی به ساختار جدید با موفقیت انجام شد. سند قدیمی به‌عنوان نسخهٔ پشتیبان دست‌نخورده باقی ماند.');
  }catch(e){
    console.error('خطا در مهاجرت دیتای قدیمی:', e);
  }
}

  renderLoading(){

     اگر بعداً برای اولین‌بار روی این گوشی آفلاین وارد شود، از همان نقش ذخیره‌شده استفاده می‌شود
     نه اینکه خودکار staff در نظر گرفته شود. */
  _roleCacheKey(uid_){ return 'hesabdari_role_'+uid_; },
  async afterLogin(u){
    const cacheKey = this._roleCacheKey(u.uid);
    try{
      const teamSnap = await getDoc(teamDocRef(u.uid));
      this.role = teamSnap.exists() ? (teamSnap.data().role||'staff') : 'staff';
      try{ localStorage.setItem(cacheKey, this.role); }catch(e){}
    }catch(e){
      let cached=null;
      try{ cached = localStorage.getItem(cacheKey); }catch(e2){}
      this.role = cached || 'staff';
    }

    await migrateOldDataIfNeeded();
    this._subscribeAll();
    this._maybeAskDeviceLabel();

    // اگر قبلاً برای این کاربر PIN تعیین شده، صفحه را قفل کن.
    // نکته امنیتی: اگر بررسی به‌هر دلیل (مثلاً قطعی موقت اینترنت) ناکام بماند، به‌جای فرض
    // «PIN ندارد»، چند بار دوباره تلاش می‌کنیم — چون فرض اشتباه یعنی دور زدن قفل امنیتی.
    this._checkPinAtLogin(3);
  },
  async _checkPinAtLogin(retriesLeft){
    try{
      const savedHash = await this.getMyPinHash();
      this.myPinHash = savedHash;
      if(savedHash){ this.pinLocked=true; this.renderPinRoot(); }
    }catch(e){
      if(retriesLeft>0){ setTimeout(()=>this._checkPinAtLogin(retriesLeft-1), 1500); }
      // اگر همهٔ تلاش‌ها ناکام بماند (مثلاً واقعاً آفلاین و هیچ‌وقت این دستگاه وارد نشده)،
      // برنامه طبق رفتار پیش‌فرض (بدون قفل اضافه) باز می‌شود — چون بدون هیچ داده‌ای حتی
      // ورود Firebase هم ممکن نبوده، این حالت در عمل رخ نمی‌دهد.
    }
  },

  /* ---------- ثبت‌کنندهٔ رکورد (کاربر + گوشی) ---------- */
  recordMeta(){
    return {
      createdByEmail: (this.user && this.user.email) || '',
      createdByDevice: getDeviceLabel() || ('دستگاه '+getDeviceId().slice(-5)),
    };
  },
  editMeta(){
    return {
      lastEditedByEmail: (this.user && this.user.email) || '',
      lastEditedByDevice: getDeviceLabel() || ('دستگاه '+getDeviceId().slice(-5)),
      lastEditedTs: Date.now(),
    };
  },
  whoLabel(rec){
    if(!rec) return '';
    const who=[rec.createdByEmail, rec.createdByDevice].filter(Boolean).join(' · ');
    return who ? 'ثبت‌شده توسط: '+who : '';
  },
  _maybeAskDeviceLabel(){
    if(getDeviceLabel()) return;
    setTimeout(()=>{
      const val=prompt('برای شناسایی بهتر معاملات، یک نام برای این گوشی/دستگاه بگذارید (مثلاً «گوشی احمد» یا «دفتر»). بعداً هم از تنظیمات قابل تغییر است:', '');
      if(val && val.trim()) setDeviceLabel(val.trim());
      this.render();
    }, 400);
  },

  _teardown(){
    if(this._unsubs){ this._unsubs.forEach(fn=>{ try{ fn(); }catch(e){} }); }
    this._unsubs=[];
  },

  _subscribeAll(){
    this._teardown();
    this._loadedParts = new Set();
    const totalParts = COLLECTIONS.length + 1; // + settings

    const checkReady = ()=>{
      if(!this.dataReady && this._loadedParts.size>=totalParts){
        this.dataReady = true;
      }
      document.getElementById('biz-name').textContent = this.state.settings.businessName || 'فروشگاه صانع';
      {const _bd=document.getElementById('biz-date'); if(_bd) _bd.textContent = dateLabel(todayISO());}
      this.renderNav();
      this.render();
    };

    COLLECTIONS.forEach(name=>{
      const unsub = onSnapshot(cols[name], (snap)=>{
        const arr = [];
        snap.forEach(d=>arr.push(d.data()));
        this.state[name] = arr;
        if(name==='sales' || name==='purchases') migrateRecordArrays(this.state.sales, this.state.purchases);
        this._loadedParts.add(name);
        checkReady();
      }, (err)=>console.error('sync error ('+name+')', err));
      this._unsubs.push(unsub);
    });

    const unsubSettings = onSnapshot(settingsDocRef, {includeMetadataChanges:true}, async (snap)=>{
      if(snap.exists()){
        this.state.settings = migrateSettings(snap.data());
      } else {
        this.state.settings = defaultSettings();
        try{ await setDoc(settingsDocRef, this.state.settings); }catch(e){}
      }
      this._loadedParts.add('settings');
      if(!navigator.onLine) this.setSyncState('offline');
      else this.setSyncState(snap.metadata.hasPendingWrites ? 'pending' : 'ok');
      checkReady();
    }, (err)=>console.error('sync error (settings)', err));
    this._unsubs.push(unsubSettings);

    window.addEventListener('online', ()=> this.setSyncState('ok'));
    window.addEventListener('offline', ()=> this.setSyncState('offline'));
    this.setSyncState(navigator.onLine ? 'ok' : 'offline');
  },

  // با همین ایمیل وارد شده باشد — یعنی حتی اگر یک نقش owner به‌اشتباه به کاربر دیگری
  // داده شود، تا وقتی ایمیلش manager@motar.com نباشد، دسترسی مدیریتی نمی‌گیرد.
  OWNER_EMAIL: 'manager@motar.com',
  isOwner(){ return this.role==='owner' && !!this.user && this.user.email===this.OWNER_EMAIL; },

  openFormModal({title, sub, fields, submitLabel, danger, onSubmit}){
    this.modal = {kind:'form', title, sub, fields, submitLabel:submitLabel||'ذخیره', danger:!!danger, onSubmit};
    this.renderModalRoot();
  },
  openConfirmModal({title, msg, danger, confirmLabel, onConfirm}){
    this.modal = {kind:'confirm', title, msg, danger:!!danger, confirmLabel:confirmLabel||'تأیید', onConfirm};
    this.renderModalRoot();
  },
  closeModal(){ this.modal=null; this.renderModalRoot(); },
  async submitFormModal(){
    if(!this.modal || this.modal.kind!=='form') return;
    const vals={};
    for(const f of this.modal.fields){
      const el = document.getElementById('mf-'+f.key);
      if(!el) continue;
      vals[f.key] = f.type==='number' ? (el.value===''?null:parseFloat(el.value)) : el.value;
    }
    const errEl = document.getElementById('modal-err');
    try{
      const res = await this.modal.onSubmit(vals);
      if(res===false) return;
      this.closeModal();
    }catch(err){
      if(errEl) errEl.textContent = err && err.message ? err.message : 'خطا؛ دوباره تلاش کنید.';
    }
  },
  confirmModalYes(){

        </div>

      if(f.type==='textarea'){
        return `<label>${escapeHtml(f.label)}</label><textarea id="mf-${f.key}" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(f.value||'')}</textarea>
        ${f.hint?`<div class="field-note">${escapeHtml(f.hint)}</div>`:''}`;
      }
      const type = f.type==='number' ? 'number' : 'text';
      const inputmode = f.type==='number' ? 'decimal' : 'text';

      return `<label>${escapeHtml(f.label)}</label>
      <input id="mf-${f.key}" type="${type}" inputmode="${inputmode}" ${step?`step="${step}"`:''} placeholder="${escapeHtml(f.placeholder||'')}" value="${f.value!==undefined && f.value!==null ? escapeHtml(String(f.value)) : ''}">
      ${f.hint?`<div class="field-note">${escapeHtml(f.hint)}</div>`:''}`;

      <div class="modal-sheet">

        <div class="modal-title">${escapeHtml(m.title||'')}<span class="close" onclick="App.closeModal()">✕</span></div>

        <div class="modal-actions">
          <button class="btn btn-outline" onclick="App.closeModal()">انصراف</button>

  openSearch(){ this.searchOpen=true; this.searchQuery=''; this.renderSearchRoot(); setTimeout(()=>{ const el=document.getElementById('global-search-input'); if(el) el.focus(); },50); },
  closeSearch(){ this.searchOpen=false; this.renderSearchRoot(); },
  onSearchInput(v){ this.searchQuery=v; this.renderSearchRoot(); },
  runGlobalSearch(q){
    q=(q||'').trim();
    if(!q) return {products:[],customers:[],suppliers:[],sales:[],purchases:[]};
    const norm = s=>String(s||'').toLowerCase();
    const nq = norm(q);
    const products = this.state.products.filter(p=>norm(p.name).includes(nq)).slice(0,8);
    const customers = this.state.customers.filter(c=>norm(c.name).includes(nq)||norm(c.phone).includes(nq)).slice(0,8);
    const suppliers = this.state.suppliers.filter(c=>norm(c.name).includes(nq)||norm(c.phone).includes(nq)).slice(0,8);
    const invNo = nq.replace(/^#/,'').replace(/^0+/,'');
    const sales = this.state.sales.filter(s=> norm(s.customerName).includes(nq) || (invNo && String(this.saleSeqNo(s.id)).includes(invNo)) ).slice(0,8);
    const purchases = this.state.purchases.filter(s=> norm(s.supplierName).includes(nq) ).slice(0,8);
    return {products,customers,suppliers,sales,purchases};
  },
  renderSearchRoot(){
    const root=document.getElementById('search-root'); if(!root) return;
    if(!this.searchOpen){ root.innerHTML=''; return; }
    const q=this.searchQuery;
    const r = this.runGlobalSearch(q);
    const hasAny = r.products.length||r.customers.length||r.suppliers.length||r.sales.length||r.purchases.length;
    const group = (title, arr, renderRow) => arr.length ? `<div class="search-group-title">${title}</div>` + arr.map(renderRow).join('') : '';
    const body = !q.trim() ? `<div class="empty"><span class="ic">🔍</span>نام محصول، مشتری، عمده‌فروش یا شمارهٔ فاکتور را بنویسید</div>` :
      (!hasAny ? `<div class="empty"><span class="ic">🙁</span>چیزی پیدا نشد</div>` :
      group('🗂️ محصولات', r.products, p=>`<div class="row-item clickable" onclick="App.closeSearch(); App.navigate('more','products');"><div class="r-left"><b>${escapeHtml(p.name)}</b><span class="sub">موجودی: ${p.stock} ${escapeHtml(p.unit)}</span></div><div class="r-right num">${fmt(p.sellPrice)}</div></div>`)
      + group('👤 مشتریان', r.customers, c=>`<div class="row-item clickable" onclick="App.closeSearch(); App.navigate('customers'); App.openParty('customers','${c.id}');"><div class="r-left"><b>${escapeHtml(c.name)}</b><span class="sub">${escapeHtml(c.phone||'')}</span></div><div class="r-right num" style="color:${c.balance>0.5?'var(--red)':'var(--green)'}">${fmt(c.balance||0)}</div></div>`)
      + group('🏭 عمده‌فروشان', r.suppliers, c=>`<div class="row-item clickable" onclick="App.closeSearch(); App.navigate('customers'); App.openParty('suppliers','${c.id}');"><div class="r-left"><b>${escapeHtml(c.name)}</b><span class="sub">${escapeHtml(c.phone||'')}</span></div><div class="r-right num" style="color:${c.balance>0.5?'var(--red)':'var(--green)'}">${fmt(c.balance||0)}</div></div>`)
      + group('🧾 فروش‌ها', r.sales, s=>`<div class="row-item clickable" onclick="App.closeSearch(); App.viewInvoice('${s.id}');"><div class="r-left"><b>فروش ${this.invoiceNoLabel(s.id)} — ${escapeHtml(s.customerName)}</b><span class="sub">${s.date}</span></div><div class="r-right num">${fmt(s.total)}</div></div>`)
      + group('📦 خریدها', r.purchases, s=>`<div class="row-item clickable" onclick="App.closeSearch(); App.viewPurchase('${s.id}');"><div class="r-left"><b>خرید — ${escapeHtml(s.supplierName||'—')}</b><span class="sub">${s.date}</span></div><div class="r-right num">${fmt(s.total)}</div></div>`));
    root.innerHTML = `
    <div class="search-overlay">
      <div class="search-bar">
        <input id="global-search-input" placeholder="جستجو..." value="${escapeHtml(q)}" oninput="App.onSearchInput(this.value)">
        <span class="cancel" onclick="App.closeSearch()">انصراف</span>
      </div>
      <div class="search-results">${body}</div>
    </div>`;
  },
  // نکته: تابع openParty(type,id) از قبل در بخش مشتریان/فروشندگان تعریف شده
  // (پایین‌تر در همین فایل) و همان‌جا استفاده می‌شود — اینجا دوباره تعریف نشد.

  setSyncState(st){
    this.syncState = st;
    const el=document.getElementById('sync-badge'); const txt=document.getElementById('sync-text');
    if(!el||!txt) return;
    el.className = 'sync-badge '+st;
    txt.textContent = st==='ok' ? 'همه‌چیز ذخیره شد' : st==='pending' ? 'در حال ذخیره...' : 'آفلاین — بعداً ارسال می‌شود';
  },

  pinDigit(d){
    if(this.pinEntry.length>=4) return;
    this.pinEntry += d;
    this.renderPinRoot();
    if(this.pinEntry.length===4) setTimeout(()=>this.checkPin(),120);
  },
  pinBackspace(){ this.pinEntry=this.pinEntry.slice(0,-1); this.renderPinRoot(); },
  async checkPin(){
    let savedHash;
    try{
      savedHash = (this.myPinHash!==undefined) ? this.myPinHash : await this.getMyPinHash();
      this.myPinHash = savedHash;
    }catch(e){
      // نتوانستیم مطمئن شویم PIN قبلی چه بوده (مثلاً قطعی اینترنت) — به‌هیچ‌وجه نباید این را
      // به‌معنی «هنوز PIN نداریم» بگیریم، وگرنه هرکسی می‌تواند صفحه را با هر عددی باز/بازتنظیم کند.
      this.pinEntry=''; this.pinCheckError=true; this.renderPinRoot();
      setTimeout(()=>{ this.pinCheckError=false; this.renderPinRoot(); }, 1800);
      return;
    }
    if(!savedHash){
      await this.setMyPinHash(this.pinEntry);
      this.myPinHash = await sha256Hex(this.pinEntry);
      this.pinLocked=false; this.pinEntry=''; this.renderPinRoot();
      this.toast('قفل PIN تنظیم شد ✅');
      return;
    }
    const h = await sha256Hex(this.pinEntry);
    if(h===savedHash){ this.pinLocked=false; this.pinEntry=''; this.renderPinRoot(); }
    else { this.pinEntry=''; this.pinShake=true; this.renderPinRoot(); setTimeout(()=>{this.pinShake=false;},400); }
  },
  async getMyPinHash(){
    if(!this.user) return null;
    const snap = await getDoc(teamDocRef(this.user.uid)); // اگر خطا بدهد، عمداً throw می‌کند (fail-safe نه fail-open)
    return snap.exists() ? (snap.data().pinHash||null) : null;
  },
  async setMyPinHash(pin){
    if(!this.user) return;
    const h = await sha256Hex(pin);
    try{ await setDoc(teamDocRef(this.user.uid), {pinHash:h}, {merge:true}); }catch(e){}
  },
  async resetPin(){
    if(!this.user) return;
    try{ await setDoc(teamDocRef(this.user.uid), {pinHash:null}, {merge:true}); this.myPinHash=null; this.toast('قفل PIN حذف شد — دفعهٔ بعد یک PIN جدید تعیین کنید'); }
    catch(e){ this.toast('خطا در حذف PIN؛ اتصال اینترنت را بررسی کنید'); }
  },
  lockNow(){ if(!this.user) return; this.pinLocked=true; this.pinEntry=''; this.renderPinRoot(); },
  renderPinRoot(){
    const root=document.getElementById('pin-root'); if(!root) return;
    if(!this.pinLocked){ root.innerHTML=''; return; }
    const dots = [0,1,2,3].map(i=>`<span class="${i<this.pinEntry.length?'filled':''}"></span>`).join('');
    const pad = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    root.innerHTML = `
    <div class="pin-screen">
      <div style="font-size:34px;">🔒</div>
      <div style="font-weight:800;font-size:16px;margin-top:8px;">${escapeHtml(this.state.settings.businessName||'ورود امن')}</div>
      <div style="font-size:12.5px;color:#b7b1a2;margin-top:4px;">${this.pinCheckError?'⚠️ اتصال قطع است — نمی‌توان تأیید کرد، دوباره تلاش می‌شود...':(this.pinShake?'کد اشتباه بود، دوباره':'کد ۴ رقمی خود را وارد کنید')}</div>
      <div class="pin-dots">${dots}</div>
      <div class="pin-pad">
        ${pad.map(k=> k==='⌫' ? `<button onclick="App.pinBackspace()">⌫</button>` : (k===''?`<button class="ghost"></button>`:`<button onclick="App.pinDigit('${k}')">${k}</button>`)).join('')}
      </div>
    </div>`;
  },

  toast(msg){
    const root=document.getElementById('toast-root'); if(!root) return;
    const id='t'+Date.now();
    root.innerHTML += `<div id="${id}" style="position:fixed;bottom:96px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;z-index:400;box-shadow:var(--shadow-lg);white-space:nowrap;">${escapeHtml(msg)}</div>`;
    setTimeout(()=>{ const el=document.getElementById(id); if(el) el.remove(); },2200);
  },

  /* ---------- Computations (بدون تغییر) ---------- */
  cashBalance(){
    const s=this.state;
    let cash = Number(s.settings.openingCash)||0;
    cash += sum(s.sales,'paid');
    cash += sum(s.payments.filter(p=>p.type==='receive'),'amount');
    s.purchases.forEach(p=>{
      const paidAFN = p.currency==='USD' ? (Number(p.paid)||0)*((Number(p.rateAtPurchase)||this.usdRate())||0) : (Number(p.paid)||0);
      cash -= paidAFN;
    });
    s.payments.filter(p=>p.type==='pay').forEach(p=>{
      const amtAFN = p.currency==='USD' ? (Number(p.amount)||0)*((Number(p.rate)||this.usdRate())||0) : (Number(p.amount)||0);
      cash -= amtAFN;
    });
    cash -= sum(s.expenses,'amount');
    return cash;
  },
  inventoryValue(){
    return this.state.products.reduce((a,p)=>a+(p.stock*p.avgCost),0);
  },
  totalReceivable(){ return this.state.customers.reduce((a,c)=>a+Math.max(0,c.balance||0),0); },
  totalPayable(){ return this.state.suppliers.reduce((a,c)=>a+Math.max(0,c.balance||0),0); },
  totalPayableUSD(){ return this.state.suppliers.reduce((a,c)=>a+Math.max(0,c.balanceUSD||0),0); },
  usdRate(){ return Number(this.state.settings.usdRate)||0; },
  totalPayableUSDInAFN(){ return this.totalPayableUSD() * this.usdRate(); },
  totalPayableCombinedAFN(){ return this.totalPayable() + this.totalPayableUSDInAFN(); },
  curLabel(code){ return code==='USD' ? 'دالر' : this.state.settings.currency; },
  quickSetUsdRate(){
    const cur = this.state.settings.usdRate || '';
    this.openFormModal({
      title:'✏️ نرخ دالر',
      sub:'۱ دالر معادل چند افغانی است؟',
      fields:[{key:'rate', label:'نرخ دالر (افغانی)', type:'number', step:'0.01', value:cur||''}],
      submitLabel:'ذخیره',
      onSubmit: (v)=>{
        if(!v.rate || v.rate<=0) throw new Error('نرخ نامعتبر است.');
        return updateDoc(settingsDocRef, {usdRate:v.rate}).then(()=>{ this.toast('نرخ دالر ذخیره شد ✅'); });
      }
    });
  },
  salesInRange(start,end){
    return this.state.sales.filter(x=>x.date>=start && x.date<=end);
  },
  expensesInRange(start,end){
    return this.state.expenses.filter(x=>x.date>=start && x.date<=end);
  },
  purchasesInRange(start,end){
    return this.state.purchases.filter(x=>x.date>=start && x.date<=end);
  },

  /* ---------- Dashboard ---------- */
  renderDashboard(){
    const today = todayISO();
    const todaySales = this.salesInRange(today,today);
    const todayExpensesAll = this.expensesInRange(today,today);
    const todayExpenses = todayExpensesAll.filter(e=>e.category!==WITHDRAWAL_CATEGORY);
    const todayWithdrawals = todayExpensesAll.filter(e=>e.category===WITHDRAWAL_CATEGORY);
    const todayProfit = sum(todaySales,'profit') - sum(todayExpenses,'amount');
    const cur = this.state.settings.currency;

    const recent = [
      ...this.state.sales.map(x=>({...x,_type:'sale'})),
      ...this.state.purchases.map(x=>({...x,_type:'purchase'})),
      ...this.state.expenses.map(x=>({...x,_type:'expense'})),
    ].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,8);

    const recentHtml = recent.length ? recent.map(x=>{
      const who=this.whoLabel(x);
      const whoHtml = who?`<span class="sub" style="opacity:.75;">${escapeHtml(who)}</span>`:'';
      if(x._type==='sale'){
        const tag = x.status==='cancelled' ? ' <span class="badge gold">باطل</span>' : '';
        return `<div class="row-item clickable" onclick="App.viewInvoice('${x.id}')"><div class="r-left"><b>فروش ${this.invoiceNoLabel(x.id)} — ${escapeHtml(x.customerName)}</b>${tag}<span class="sub">${x.date} · ${x.items.length} قلم</span>${whoHtml}</div><div class="r-right num" style="color:var(--green)">+${fmt(x.paid)}</div></div>`;
      } else if(x._type==='purchase'){
        const tag = x.status==='cancelled' ? ' <span class="badge gold">باطل</span>' : (x.currency==='USD' ? ' <span class="badge gold">دالر</span>' : '');
        return `<div class="row-item clickable" onclick="App.viewPurchase('${x.id}')"><div class="r-left"><b>خرید — ${escapeHtml(x.supplierName||'—')}</b>${tag}<span class="sub">${x.date} · ${x.items.length} قلم</span>${whoHtml}</div><div class="r-right num" style="color:var(--red)">-${x.currency==='USD'?fmt2(x.paid)+' $':fmt(x.paid)}</div></div>`;
      } else {
        const isW = x.category===WITHDRAWAL_CATEGORY;
        return `<div class="row-item"><div class="r-left"><b>${isW?'💰 برداشت — '+escapeHtml(x.withdrawnBy||''):'مصرف — '+escapeHtml(x.category)}</b><span class="sub">${x.date}${x.note?(' · '+escapeHtml(x.note)):''}</span>${whoHtml}</div><div class="r-right num" style="color:var(--red)">-${fmt(x.amount)}</div></div>`;
      }
    }).join('') : `<div class="empty">هنوز معامله‌ای ثبت نشده. از دکمه‌های بالا شروع کنید.</div>`;

    return `
    <div class="hero">
      <div class="row"><span class="label">💵 موجودی نقد</span><span class="val num">${fmt(this.cashBalance())} ${cur}</span></div>
      <div class="row"><span class="label">📦 ارزش کالای انبار</span><span class="val num">${fmt(this.inventoryValue())} ${cur}</span></div>
      <div class="row"><span class="label">📈 سود امروز</span><span class="val num ${todayProfit>=0?'green':'red'}">${fmt(todayProfit)} ${cur}</span></div>
    </div>
    <div class="ledger-strip">
      <div class="chip"><div class="t">فروش امروز</div><div class="v num">${fmt(sum(todaySales,'total'))}</div></div>
      <div class="chip"><div class="t">مصرف امروز</div><div class="v num">${fmt(sum(todayExpenses,'amount'))}</div></div>
      ${todayWithdrawals.length?`<div class="chip"><div class="t">💰 برداشت امروز</div><div class="v num">${fmt(sum(todayWithdrawals,'amount'))}</div></div>`:''}
      <div class="chip"><div class="t">طلب از مشتریان</div><div class="v num">${fmt(this.totalReceivable())}</div></div>
      <div class="chip"><div class="t">قرض از عمده‌فروش (${cur})</div><div class="v num">${fmt(this.totalPayable())}</div></div>
      ${this.totalPayableUSD()!==0?`<div class="chip"><div class="t">قرض از عمده‌فروش (دالر)</div><div class="v num">$${fmt2(this.totalPayableUSD())}</div></div>`:''}
      ${this.lowStockList().length?`<div class="chip warn" onclick="App.navigate('more','lowstock')" style="cursor:pointer;"><div class="t">📉 کم‌موجودی</div><div class="v num">${this.lowStockList().length} کالا</div></div>`:''}
      ${this.totalPayableUSD()!==0 && this.usdRate()>0?`<div class="chip"><div class="t">مجموع کل قرض به ${cur}</div><div class="v num">${fmt(this.totalPayableCombinedAFN())}</div></div>`:''}
      <div class="chip" onclick="App.quickSetUsdRate()" style="cursor:pointer;"><div class="t">✏️ نرخ دالر</div><div class="v num">${this.usdRate()>0?fmt2(this.usdRate()):'تنظیم کنید'}</div></div>
    </div>
    <div class="quick-actions">
      <div class="qa-btn" onclick="App.navigate('sale')"><span class="ic">🧾</span>فروش جدید</div>

      <div class="qa-btn" onclick="App.navigate('more','expenses')"><span class="ic">💸</span>ثبت مصرف</div>
    </div>
    <h2 class="section-title">آخرین معاملات</h2>
    <div class="card">${recentHtml}</div>
    `;
  },

  /* ---------- Sale ---------- */
  addSaleItem(){
    const sel=document.getElementById('sp-product');
    let pid=sel.value;
    if(!pid){ this.toast('یک محصول انتخاب کنید'); return; }
    let product;
    if(pid==='__new__'){
      const name=(document.getElementById('sp-newname').value||'').trim();
      const unit=(document.getElementById('sp-newunit').value||'').trim()||'عدد';
      if(!name){ this.toast('نام محصول جدید را بنویسید'); return; }
      // نکته: این محصول هنوز در دیتابیس ذخیره نمی‌شود؛ فقط وقتی فاکتور نهایی ثبت شود ذخیره خواهد شد
      // (تا اگر فاکتور رها شود، محصول یتیم با موجودی صفر در فهرست باقی نماند)
      product = { id: uid(), name, unit, stock:0, avgCost:0, sellPrice:0, _draftOnly:true };
      this.saleDraft._draftProducts = this.saleDraft._draftProducts || [];
      this.saleDraft._draftProducts.push(product);
    } else {
      product = this.state.products.find(p=>p.id===pid);
    }
    if(!product){ this.toast('محصول یافت نشد'); return; }
    const qty = pid==='__new__' ? parseFloat(document.getElementById('sp-qty').value) : this.packAdjustedQty('sp');
    const price=parseFloat(document.getElementById('sp-price').value);
    if(!qty||qty<=0){ this.toast('تعداد را درست بنویسید'); return; }
    if(isNaN(price)||price<0){ this.toast('قیمت فروش را بنویسید'); return; }
    if(qty>product.stock){
      if(!confirm('موجودی این محصول کافی نیست ('+product.stock+' '+product.unit+' باقی‌مانده). آیا ادامه می‌دهید؟')) return;
    }
    this.saleDraft.items.push({productId:product.id,name:product.name,unit:product.unit,qty,unitPrice:price,cost:product.avgCost});
    this.render();
  },
  removeSaleItem(idx){ this.saleDraft.items.splice(idx,1); this.render(); },

  submitSale(){
    if(this.saleDraft.items.length===0){ this.toast('حداقل یک محصول اضافه کنید'); return; }
    const total = this.saleDraft.items.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const totalCost = this.saleDraft.items.reduce((a,i)=>a+i.qty*i.cost,0);
    let paid = parseFloat(document.getElementById('sale-paid').value);
    if(isNaN(paid)) paid=0;
    if(paid>total) paid=total;
    if(paid<0) paid=0;
    const custName = (document.getElementById('sale-customer-name').value||'').trim();
    const custPhone = (document.getElementById('sale-customer-phone').value||'').trim();
    const custAddress = (document.getElementById('sale-customer-address').value||'').trim();
    const date = document.getElementById('sale-date').value || todayISO();
    const note = (document.getElementById('sale-note').value||'').trim();
    const remaining = total-paid;

    const batch = writeBatch(db);
    let customerId=null, customerNameFinal='مشتری نقدی';
    if(custName){
      let customer=this.state.customers.find(c=>c.name===custName);
      if(!customer){
        customerId=uid(); customerNameFinal=custName;
        batch.set(doc(cols.customers,customerId), {id:customerId,name:custName,phone:custPhone,address:custAddress,balance:remaining, ...this.recordMeta()});
      } else {
        customerId=customer.id; customerNameFinal=customer.name;
        const fields={ balance: increment(remaining) };
        if(custPhone && !customer.phone) fields.phone=custPhone;
        if(custAddress && !customer.address) fields.address=custAddress;
        batch.update(doc(cols.customers,customer.id), fields);
      }
    } else if(remaining>0.001){
      this.toast('برای فروش قرضی (نسیه) باید نام مشتری را بنویسید'); return;
    }

    // محصولات جدیدی که فقط در پیش‌نویس بودند، حالا برای اولین بار ذخیره می‌شوند
    const draftProducts = this.saleDraft._draftProducts || [];
    this.saleDraft.items.forEach(it=>{
      const draftP = draftProducts.find(dp=>dp.id===it.productId);
      if(draftP){
        batch.set(doc(cols.products, draftP.id), {id:draftP.id, name:draftP.name, unit:draftP.unit, stock:-it.qty, avgCost:0, sellPrice:it.unitPrice});
      } else {
        batch.update(doc(cols.products, it.productId), { stock: increment(-it.qty) });
      }
    });

    const saleId = uid();
    const newSale = {
      id:saleId, ts:Date.now(), date, customerId, customerName:customerNameFinal,
      customerPhone: custPhone, customerAddress: custAddress,
      items:this.saleDraft.items.map(it=>({...it,returnedQty:0})), total, totalCost, profit: total-totalCost,
      paid, remaining, note, status:'active', returns:[], originalTotal: total, discount:0,
      ...this.recordMeta()
    };
    batch.set(doc(cols.sales, saleId), newSale);

    batch.commit().catch(e=>{ console.error('submitSale error',e); alert('خطا در ذخیرهٔ فاکتور؛ اتصال اینترنت را بررسی کنید (در حالت آفلاین هم باید ذخیره شود، دوباره تلاش کنید).'); });

    this.resetSaleDraft();
    this.viewInvoiceId = saleId;
    this.navigate('invoice');
  },

  /* ---------- Invoice view / print / whatsapp ---------- */
  viewInvoice(id){ this.viewInvoiceId=id; this.navigate('invoice'); },
  printInvoice(){ window.print(); },
  // شمارهٔ فاکتور دیگر یک شمارندهٔ مشترک نیست (که در حالت آفلاین/هم‌زمان می‌توانست
  // برای دو فاکتور مختلف یک عدد تکراری بسازد)، بلکه از ترتیب زمانی خود فاکتورها
  // محاسبه می‌شود. چون هر فاکتور یک id یکتا دارد، هیچ‌وقت دو فاکتور شمارهٔ یکسان نمی‌گیرند،
  // حتی اگر چند نفر هم‌زمان و آفلاین فاکتور ثبت کرده باشند.
  saleSeqNo(saleId){
    const sorted = [...this.state.sales].sort((a,b)=> (a.ts||0)-(b.ts||0) || (a.id<b.id?-1:1));
    const idx = sorted.findIndex(s=>s.id===saleId);
    return idx>=0 ? idx+1 : 0;
  },
  invoiceNoLabel(saleId){ return '#'+String(this.saleSeqNo(saleId)).padStart(5,'0'); },
  waPhoneDigits(phone){
    let d=(phone||'').replace(/[^0-9]/g,'');
    if(!d) return '';
    if(d.startsWith('0093')) d='93'+d.slice(4);      // پیشوند بین‌المللی 00 + کد کشور (احتیاطی)
    else if(d.startsWith('00')) d=d.slice(2);        // پیشوند بین‌المللی 00 خام
    else if(d.startsWith('0')) d='93'+d.slice(1);    // شماره محلی با صفر → +93
    else if(!d.startsWith('93') && d.length<=10) d='93'+d; // بدون کد کشور و بدون صفر
    return d;
  },
  buildInvoiceText(sale){
    const s=this.state.settings;
    let lines=[];
    lines.push(`${s.logoEmoji||''} ${s.businessName}`.trim());
    if(s.businessPhone) lines.push('تماس: '+s.businessPhone);
    lines.push('———————————————');
    if(sale.status==='cancelled') lines.push('⚠️ این فاکتور باطل شده است');
    lines.push('فاکتور فروش '+this.invoiceNoLabel(sale.id));
    lines.push('تاریخ: '+sale.date);
    lines.push('مشتری: '+sale.customerName);
    if(sale.customerPhone) lines.push('تماس مشتری: '+sale.customerPhone);
    if(sale.customerAddress) lines.push('آدرس: '+sale.customerAddress);
    lines.push('———————————————');
    sale.items.forEach((it,idx)=>{
      const ret = it.returnedQty ? ` (مرجوعی: ${it.returnedQty})` : '';
      lines.push(`${idx+1}. ${it.name} — ${it.qty} ${it.unit} × ${fmt(it.unitPrice)} = ${fmt(it.qty*it.unitPrice)}${ret}`);
    });
    lines.push('———————————————');
    if(sale.originalTotal!==undefined && Math.abs(sale.originalTotal-sale.total)>0.5) lines.push('مجموع اولیهٔ فاکتور: '+fmt(sale.originalTotal)+' '+s.currency);
    if(sale.discount>0.5) lines.push('🏷 تخفیف داده‌شده: '+fmt(sale.discount)+' '+s.currency);
    lines.push('مجموع فاکتور: '+fmt(sale.total)+' '+s.currency);
    lines.push('پرداخت‌شده: '+fmt(sale.paid)+' '+s.currency);
    if(sale.status==='cancelled') lines.push('وضعیت: باطل شده ❌');
    else if(sale.remaining>0.5) lines.push('باقیمانده (قرض): '+fmt(sale.remaining)+' '+s.currency);
    else lines.push('وضعیت: تسویه‌شده ✅');
    if(sale.note) lines.push('یادداشت: '+sale.note);
    if(sale.returns && sale.returns.length){
      lines.push('———————————————');
      lines.push('↩️ کالاهای مرجوعی:');
      sale.returns.forEach(r=> lines.push(`- ${r.name} — ${r.qty} عدد — ${fmt(r.amount)} ${s.currency}`));
    }
    lines.push('———————————————');
    lines.push('با تشکر از خرید شما 🙏');
    return lines.join('\n');
  },
  sendInvoiceWhatsApp(id){
    const sale=this.state.sales.find(x=>x.id===id);
    if(!sale) return;
    const text=encodeURIComponent(this.buildInvoiceText(sale));
    const digits=this.waPhoneDigits(sale.customerPhone);
    const url = digits ? `https://wa.me/${digits}?text=${text}` : `https://wa.me/?text=${text}`;
    window.open(url,'_blank');
  },

    <div id="invoice-print" class="card">

        <div class="row-item"><div class="r-left"><b>${sale.remaining>0.5?'باقیمانده (قرض)':'وضعیت'}</b></div><div class="r-right num" style="color:${sale.remaining>0.5?'var(--red)':'var(--green)'}"><b>${cancelled?'باطل شده':(sale.remaining>0.5?fmt(sale.remaining)+' '+s.currency:'تسویه‌شده ✅')}</b></div></div>

  /* ---------- Invoice full edit (items price/qty + customer info) ----------
     برخلاف افزودن/مرجوعی که فقط یک تغییر کوچک را ثبت می‌کنند، این حالت به کاربر
     اجازه می‌دهد قیمت و تعداد هر قلم و نیز اطلاعات مشتری (نام/شماره/آدرس) را
     یک‌جا ویرایش کند. بعد از ذخیره، مجموع فاکتور، بدهی مشتری (قدیم/جدید) و
     موجودی انبار همگی بر اساس مقدار جدید دوباره محاسبه و اصلاح می‌شوند. */

    <button class="back-btn" onclick="App.cancelEditInvoice()">← انصراف از ویرایش</button>

      <label>نام مشتری (خالی = فروش نقدی)</label>

      <label>یادداشت</label>

        <button class="btn btn-primary" onclick="App.saveEditInvoice('${sale.id}')">💾 ذخیرهٔ ویرایش</button>
        <button class="btn btn-outline" onclick="App.cancelEditInvoice()">انصراف</button>
      </div>

  },

  startEditInvoice(saleId){
    const sale=this.state.sales.find(x=>x.id===saleId); if(!sale) return;
    if(sale.status==='cancelled'){ this.toast('این فاکتور باطل شده است و قابل ویرایش نیست.'); return; }
    this.editingInvoiceId=saleId;
    this.render();
  },
  cancelEditInvoice(){
    this.editingInvoiceId=null;
    this.render();
  },
  saveEditInvoice(saleId){
    const sale=this.state.sales.find(x=>x.id===saleId); if(!sale) return;
    if(sale.status==='cancelled'){ this.toast('این فاکتور باطل شده است.'); return; }

    const newItems = sale.items.map((it,idx)=>{
      const qtyEl=document.getElementById('edit-item-qty-'+idx);
      const priceEl=document.getElementById('edit-item-price-'+idx);
      const qty=parseFloat(qtyEl ? qtyEl.value : NaN);
      const unitPrice=parseFloat(priceEl ? priceEl.value : NaN);
      return {...it, qty, unitPrice};
    });
    for(const it of newItems){
      if(isNaN(it.qty)||it.qty<=0){ alert('تعداد نامعتبر برای «'+it.name+'»'); return; }
      if(isNaN(it.unitPrice)||it.unitPrice<0){ alert('قیمت نامعتبر برای «'+it.name+'»'); return; }
      if(it.qty < (it.returnedQty||0)){ alert('تعداد «'+it.name+'» نمی‌تواند کمتر از مقدار مرجوعی‌شدهٔ آن ('+(it.returnedQty||0)+' '+it.unit+') باشد.'); return; }
    }

    const custName=(document.getElementById('edit-customer-name').value||'').trim();
    const custPhone=(document.getElementById('edit-customer-phone').value||'').trim();
    const custAddress=(document.getElementById('edit-customer-address').value||'').trim();
    const date=document.getElementById('edit-sale-date').value || sale.date;
    const note=(document.getElementById('edit-sale-note').value||'').trim();

    const newTotal = newItems.reduce((a,i)=>a+(i.qty-(i.returnedQty||0))*i.unitPrice,0);
    const newTotalCost = newItems.reduce((a,i)=>a+(i.qty-(i.returnedQty||0))*(i.cost||0),0);

    let paid=parseFloat(document.getElementById('edit-sale-paid').value);
    if(isNaN(paid)||paid<0) paid=0;
    if(paid>newTotal) paid=newTotal;
    const newRemaining=newTotal-paid;

    if(!custName && newRemaining>0.001){ this.toast('برای فروش قرضی (نسیه) باید نام مشتری مشخص باشد.'); return; }

    // موجودی انبار: فقط تفاوت تعداد نسبت به مقدار قبلیِ همان قلم اعمال می‌شود
    const stockDeltas={};
    newItems.forEach((it,idx)=>{
      const deltaQty = it.qty - sale.items[idx].qty;
      if(deltaQty!==0) stockDeltas[it.productId]=(stockDeltas[it.productId]||0)-deltaQty;
    });
    let willGoNegative=false;
    Object.keys(stockDeltas).forEach(pid=>{
      const p=this.state.products.find(x=>x.id===pid);
      if(p && (p.stock+stockDeltas[pid])<0) willGoNegative=true;
    });
    if(willGoNegative && !confirm('با این ویرایش موجودی برخی کالاها منفی می‌شود. آیا ادامه می‌دهید؟')) return;

    const batch=writeBatch(db);
    const oldCustomerId=sale.customerId;
    const oldRemaining=sale.remaining||0;
    let newCustomerId=null, newCustomerNameFinal='مشتری نقدی';

    if(custName){
      const existing=this.state.customers.find(c=>c.name===custName);
      if(existing){ newCustomerId=existing.id; newCustomerNameFinal=existing.name; }
      else { newCustomerId=uid(); newCustomerNameFinal=custName; }
    }

    // اصلاح بدهی مشتری قدیم/جدید (delta-based، تا با ویرایش هم‌زمان تداخل نکند)
    if(oldCustomerId && newCustomerId && oldCustomerId===newCustomerId){
      const existing=this.state.customers.find(c=>c.id===oldCustomerId);
      const fields={ balance: increment(newRemaining-oldRemaining) };
      if(custPhone && custPhone!==(existing&&existing.phone)) fields.phone=custPhone;
      if(custAddress && custAddress!==(existing&&existing.address)) fields.address=custAddress;
      batch.update(doc(cols.customers,oldCustomerId), fields);
    } else {
      if(oldCustomerId && Math.abs(oldRemaining)>0.0001){
        batch.update(doc(cols.customers,oldCustomerId), { balance: increment(-oldRemaining) });
      }
      if(newCustomerId){
        const existing=this.state.customers.find(c=>c.id===newCustomerId);
        if(existing){
          const fields={};
          if(Math.abs(newRemaining)>0.0001) fields.balance=increment(newRemaining);
          if(custPhone && custPhone!==existing.phone) fields.phone=custPhone;
          if(custAddress && custAddress!==existing.address) fields.address=custAddress;
          if(Object.keys(fields).length) batch.update(doc(cols.customers,newCustomerId), fields);
        } else {
          batch.set(doc(cols.customers,newCustomerId), {id:newCustomerId,name:custName,phone:custPhone,address:custAddress,balance:newRemaining, ...this.recordMeta()});
        }
      }
    }

    Object.keys(stockDeltas).forEach(pid=>{
      if(stockDeltas[pid]!==0) batch.update(doc(cols.products,pid), { stock: increment(stockDeltas[pid]) });
    });

    batch.update(doc(cols.sales, sale.id), {
      items:newItems, customerId:newCustomerId, customerName:newCustomerNameFinal,
      customerPhone:custPhone, customerAddress:custAddress, date, note,
      total:newTotal, totalCost:newTotalCost, profit:newTotal-newTotalCost,
      paid, remaining:newRemaining, ...this.editMeta()
    });

    batch.commit().then(()=>{
      this.editingInvoiceId=null;
      this.render();
    }).catch(e=>{ console.error('saveEditInvoice error',e); this.toast('خطا در ذخیرهٔ ویرایش؛ اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.'); });
  },

  addPurchaseItem(){
    const sel=document.getElementById('pp-product');
    let pid=sel.value;
    if(!pid){ this.toast('یک محصول انتخاب کنید'); return; }
    let product;
    if(pid==='__new__'){
      const name=(document.getElementById('pp-newname').value||'').trim();
      const unit=(document.getElementById('pp-newunit').value||'').trim()||'عدد';
      if(!name){ this.toast('نام محصول جدید را بنویسید'); return; }
      product = { id: uid(), name, unit, stock:0, avgCost:0, sellPrice:0, _draftOnly:true };
      this.purchaseDraft._draftProducts = this.purchaseDraft._draftProducts || [];
      this.purchaseDraft._draftProducts.push(product);
    } else {
      product = this.state.products.find(p=>p.id===pid);
    }
    if(!product){ this.toast('محصول یافت نشد'); return; }
    const qty = pid==='__new__' ? parseFloat(document.getElementById('pp-qty').value) : this.packAdjustedQty('pp');
    const cost=parseFloat(document.getElementById('pp-cost').value);
    if(!qty||qty<=0){ this.toast('تعداد را درست بنویسید'); return; }
    if(isNaN(cost)||cost<0){ this.toast('قیمت خرید را بنویسید'); return; }
    this.purchaseDraft.items.push({productId:product.id,name:product.name,unit:product.unit,qty,unitCost:cost});
    this.render();
  },

  async submitPurchase(){
    if(this.purchaseDraft.items.length===0){ this.toast('حداقل یک محصول اضافه کنید'); return; }
    const total = this.purchaseDraft.items.reduce((a,i)=>a+i.qty*i.unitCost,0);
    let paid = parseFloat(document.getElementById('purchase-paid').value);
    if(isNaN(paid)) paid=0;
    if(paid>total) paid=total;
    if(paid<0) paid=0;
    const currency = (document.getElementById('purchase-currency') && document.getElementById('purchase-currency').value==='USD') ? 'USD' : 'AFN';
    let rateAtPurchase = 1;
    if(currency==='USD'){
      rateAtPurchase = this.usdRate();
      if(rateAtPurchase<=0){ this.toast('لطفاً ابتدا نرخ فعلی دالر را وارد کنید (دکمهٔ «نرخ دالر» بالای همین فرم).'); return; }
    }
    const balField = currency==='USD' ? 'balanceUSD' : 'balance';
    const supName = (document.getElementById('purchase-supplier-name').value||'').trim();
    const date = document.getElementById('purchase-date').value || todayISO();
    const note = (document.getElementById('purchase-note').value||'').trim();
    const remaining = total-paid;

    const batch = writeBatch(db);
    let supplierId=null, supplierNameFinal=supName||'—';
    if(supName){
      let supplier=this.state.suppliers.find(c=>c.name===supName);
      if(!supplier){
        supplierId=uid(); supplierNameFinal=supName;
        batch.set(doc(cols.suppliers,supplierId), {id:supplierId,name:supName,phone:'',address:'',balance:currency==='AFN'?remaining:0,balanceUSD:currency==='USD'?remaining:0, ...this.recordMeta()});
      } else {
        supplierId=supplier.id; supplierNameFinal=supplier.name;
        batch.update(doc(cols.suppliers,supplier.id), { [balField]: increment(remaining) });
      }
    } else if(remaining>0.001){
      this.toast('برای خرید نسیه باید نام عمده‌فروش/شرکت را بنویسید'); return;
    }

    const draftProducts = this.purchaseDraft._draftProducts || [];
    this.purchaseDraft.items.forEach(it=>{
      const unitCostAFN = currency==='USD' ? it.unitCost*rateAtPurchase : it.unitCost;
      const draftP = draftProducts.find(dp=>dp.id===it.productId);
      if(draftP){
        batch.set(doc(cols.products, draftP.id), {id:draftP.id, name:draftP.name, unit:draftP.unit, stock:it.qty, avgCost:unitCostAFN, sellPrice:Math.round(unitCostAFN*1.15)});
      } else {
        const p = this.state.products.find(pp=>pp.id===it.productId);
        if(p){
          const newStock = p.stock + it.qty;
          const newAvgCost = newStock>0 ? ((p.stock*p.avgCost)+(it.qty*unitCostAFN))/newStock : unitCostAFN;
          const fields = { stock: increment(it.qty), avgCost: newAvgCost };
          if(!p.sellPrice) fields.sellPrice = Math.round(unitCostAFN*1.15);
          batch.update(doc(cols.products, it.productId), fields);
        }
      }
    });

    const photoInput = document.getElementById('purchase-bill-photo');
    const photoFile = photoInput && photoInput.files[0];
    let billImage = null;
    if(photoFile){
      try{ billImage = await compressImageForStorage(photoFile); }
      catch(err){ alert(err.message||'خطا در پردازش عکس بل'); return; }
    }

    const purchaseId = uid();
    const newPurchase = {
      id:purchaseId, ts:Date.now(), date, supplierId, supplierName:supplierNameFinal, currency, rateAtPurchase,
      items:this.purchaseDraft.items.map(it=>({...it,returnedQty:0})), total, paid, remaining, note,
      status:'active', returns:[], originalTotal: total,
      ...this.recordMeta()
    };
    if(billImage) newPurchase.billImage = billImage;
    batch.set(doc(cols.purchases, purchaseId), newPurchase);

    batch.commit().catch(e=>{ console.error('submitPurchase error',e); this.toast('خطا در ذخیرهٔ بل خرید؛ اتصال اینترنت را بررسی کنید.'); });

    this.resetPurchaseDraft();
    this.viewPurchaseId = purchaseId;
    this.navigate('purchase-view');
  },

      <div class="inv-head">

      </div>
      ${this.whoLabel(pur)?`<div class="field-note no-print">${escapeHtml(this.whoLabel(pur))}${pur.lastEditedByEmail?` · آخرین ویرایش: ${escapeHtml([pur.lastEditedByEmail,pur.lastEditedByDevice].filter(Boolean).join(' · '))}`:''}</div>`:''}
      <div class="inv-cust">
        <div class="l1">شرکت / عمده‌فروش: ${escapeHtml(pur.supplierName||'—')}</div>
